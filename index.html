<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>RezLive.com | Brochure Library</title>
  <meta name="description" content="Explore RezLive.com brochures for Rail, Car Rental, Cruise, Global services and RezTez.">
  <style>
    :root{
      --bg:#ffffff;
      --surface:#f7f8fa;
      --text:#172033;
      --muted:#667085;
      --border:#e6e8ec;
      --orange:#f59a23;
      --blue:#1f9fc8;
      --shadow:0 10px 30px rgba(16,24,40,.06);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }
    a{text-decoration:none;color:inherit}
    button{font:inherit}
    .wrap{width:min(1080px,calc(100% - 32px));margin:auto}

    header{
      position:sticky;
      top:0;
      z-index:30;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
    }
    .header-inner{
      min-height:74px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
    }
    .logo{display:block;width:150px;max-width:42vw;height:auto}
    .library-label{
      color:#7a8292;
      font-size:12px;
      font-weight:700;
      letter-spacing:.04em;
      white-space:nowrap;
    }

    .hero{padding:48px 0 30px}
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:var(--blue);
      font-size:12px;
      font-weight:800;
      letter-spacing:.1em;
      text-transform:uppercase;
    }
    .eyebrow:before{
      content:"";
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--orange);
    }
    h1{
      margin:12px 0 14px;
      max-width:760px;
      font-size:clamp(34px,8vw,58px);
      line-height:1.04;
      letter-spacing:-.045em;
      font-weight:760;
    }
    .lead{
      margin:0;
      max-width:690px;
      color:var(--muted);
      font-size:15px;
      line-height:1.7;
    }

    .grid{display:grid;grid-template-columns:1fr;gap:14px;padding-bottom:56px}
    .card{
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:#fff;
      padding:20px;
      box-shadow:0 1px 2px rgba(16,24,40,.02);
      transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
    }
    .card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d8dde5}
    .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
    .index{
      width:42px;
      height:42px;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      border-radius:12px;
      background:linear-gradient(135deg,#fff5e8,#edf9fd);
      border:1px solid #f0f1f3;
      color:#344054;
      font-size:13px;
      font-weight:800;
    }
    .tag{
      display:inline-flex;
      align-items:center;
      min-height:27px;
      padding:0 9px;
      border-radius:999px;
      background:var(--surface);
      border:1px solid #eef0f2;
      color:#697386;
      font-size:10px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      text-align:right;
    }
    .card h2{margin:18px 0 7px;font-size:21px;line-height:1.22;letter-spacing:-.025em}
    .desc{margin:0;color:var(--muted);font-size:13.5px;line-height:1.58}
    .actions{display:flex;margin-top:20px}
    .btn{
      width:100%;
      min-height:44px;
      border-radius:12px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px 14px;
      font-size:13px;
      font-weight:750;
      cursor:pointer;
      transition:all .18s ease;
    }
    .primary{border:1px solid var(--text);background:var(--text);color:#fff}
    .primary:hover{background:#273247}

    footer{border-top:1px solid var(--border);padding:24px 0 32px;color:#8a94a6;text-align:center;font-size:12px}

    dialog{
      border:0;
      padding:0;
      width:min(100% - 24px,1000px);
      height:min(92dvh,900px);
      border-radius:18px;
      background:#fff;
      box-shadow:0 30px 90px rgba(16,24,40,.22);
      overflow:hidden;
    }
    dialog::backdrop{background:rgba(17,24,39,.45);backdrop-filter:blur(4px)}
    .viewer-head{height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 14px 0 18px;border-bottom:1px solid var(--border);background:#fff}
    .viewer-title{font-size:14px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .close{border:1px solid var(--border);background:#fff;color:#344054;border-radius:10px;padding:8px 11px;font-weight:700;cursor:pointer}
    iframe{width:100%;height:calc(100% - 60px);border:0;background:#fff}

    @media(max-width:680px){
      dialog{display:none!important}
      .hero{padding-top:34px}
      .card{padding:18px}
    }
    @media(min-width:720px){
      .wrap{width:min(1080px,calc(100% - 48px))}
      .hero{padding:64px 0 34px}
      .grid{grid-template-columns:repeat(2,1fr);gap:18px}
      .card{padding:22px}
    }
    @media(min-width:1020px){
      .grid{grid-template-columns:repeat(3,1fr)}
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap header-inner">
      <a href="https://www.rezlive.com/" target="_blank" rel="noopener" aria-label="RezLive.com">
        <img class="logo" src="https://rezlive8.b-cdn.net/2026/broucher/Rez%20logo.png" alt="RezLive.com">
      </a>
      <div class="library-label">BROCHURE LIBRARY</div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">RezLive.com</div>
      <h1>Digital Brochure</h1>
      <p class="lead">Explore brochures for Rail, Car Rental, Cruise, RezTez and the RezLive.com global travel distribution platform.</p>
    </section>

    <section class="grid" id="grid" aria-live="polite"></section>
  </main>

  <footer><div class="wrap">RezLive.com · Award Winning Global Reservation System</div></footer>

  <dialog id="viewer">
    <div class="viewer-head">
      <div class="viewer-title" id="viewerTitle">Brochure</div>
      <button class="close" onclick="closeViewer()">Close</button>
    </div>
    <iframe id="frame" title="RezLive.com brochure viewer"></iframe>
  </dialog>

  <script>
    const brochures = [
      {
        title:'Global Rails',
        tag:'Rail',
        desc:'Explore RezLive.com rail products and solutions in one concise brochure.',
        url:'https://rezlive8.b-cdn.net/2026/broucher/ALL%20Rail.pdf'
      },
      {
        title:'Car Rental & Cruise',
        tag:'Car Rental · Cruise',
        desc:'Discover RezLive.com car rental and cruise solutions for a broader travel portfolio.',
        url:'https://rezlive8.b-cdn.net/2026/broucher/Car%20Rental%20%26%20Cruise%20final%20%281%29.pdf'
      },
      {
        title:'Car Rental & Rail',
        tag:'Car Rental · Rail',
        desc:'A combined overview of RezLive.com car rental and rail solutions.',
        url:'https://rezlive8.b-cdn.net/2026/broucher/Car%20Rental%20%26%20Rail%20final.pdf'
      },
      {
        title:'RezLive.com',
        tag:'Global',
        desc:'A quick overview of RezLive.com and our global travel distribution capabilities.',
        url:'https://rezlive8.b-cdn.net/2026/broucher/RezLive.com%20one%20pager%20%28Global%29%20final.pdf'
      },
      {
        title:'RezTez',
        tag:'RezTez',
        desc:'An introduction to RezTez and the value it brings to RezLive.com travel partners.',
        url:'https://rezlive8.b-cdn.net/2026/broucher/RezTez%20Flyer%20final.pdf'
      }
    ];

    const grid = document.getElementById('grid');

    function render(){
      grid.innerHTML = brochures.map((b,i)=>`
        <article class="card">
          <div class="card-head">
            <div class="index">${String(i+1).padStart(2,'0')}</div>
            <span class="tag">${b.tag}</span>
          </div>
          <h2>${b.title}</h2>
          <p class="desc">${b.desc}</p>
          <div class="actions">
            <button class="btn primary" onclick="openBrochure(${i})">View Brochure</button>
          </div>
        </article>
      `).join('');
    }

    function openBrochure(i){
      const b = brochures[i];
      if(window.matchMedia('(max-width:680px)').matches){
        window.open(b.url,'_blank','noopener');
        return;
      }
      document.getElementById('viewerTitle').textContent = b.title;
      document.getElementById('frame').src = b.url + '#view=FitH';
      document.getElementById('viewer').showModal();
    }

    function closeViewer(){
      document.getElementById('viewer').close();
      document.getElementById('frame').src='';
    }

    document.getElementById('viewer').addEventListener('click',e=>{
      if(e.target.id==='viewer') closeViewer();
    });
    render();
  </script>
</body>
</html>
